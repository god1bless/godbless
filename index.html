<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>godbless</title>
<meta name="description" content="godbless: umut, huzur ve iyi dilekler için küçük bir köşe.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌅</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Newsreader:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #2a060b;
    --dawn: #4d0e17;
    --deep: #1a0306;
    --gold: #ff6b78;
    --red: #b11226;
    --ink: #fbeaea;
    --soft: #e2b4b8;
  }
  * { box-sizing: border-box; margin: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Newsreader", Georgia, serif;
    font-size: 1.2rem;
    line-height: 1.7;
    color: var(--ink);
    background: linear-gradient(180deg, var(--sky) 0%, var(--dawn) 70%, var(--deep) 100%);
    min-height: 100vh;
  }
  a { color: inherit; }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }

  header {
    display: flex; justify-content: space-between; align-items: center;
    max-width: 960px; margin: 0 auto; padding: 1.5rem 1.5rem 0;
    font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 500;
  }
  header .logo { font-weight: 800; text-decoration: none; font-size: 1.2rem; }
  nav a { margin-left: 1.5rem; text-decoration: none; color: var(--soft); }
  nav a:hover { color: var(--ink); }

  .hero {
    position: relative; overflow: hidden; text-align: center;
    padding: 12vh 1.5rem 14vh;
  }
  .hero::before {
    content: ""; position: absolute; left: 50%; bottom: -30%;
    width: 120vmin; height: 120vmin; transform: translateX(-50%);
    background: radial-gradient(circle, rgba(200,40,58,.6) 0%, rgba(120,18,30,.4) 40%, transparent 68%);
    z-index: 0;
    animation: rise 2.4s ease-out both;
  }
  @keyframes rise { from { transform: translate(-50%, 25%); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
  .hero > * { position: relative; z-index: 1; }
  h1 {
    font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 800;
    font-size: clamp(3.5rem, 17vw, 10rem); line-height: 1; letter-spacing: -0.04em;
  }
  .hero p { max-width: 30ch; margin: 1.5rem auto 2rem; font-style: italic; color: var(--soft); font-size: 1.4rem; }
  .btn {
    display: inline-block; margin-top: 2rem; padding: .8rem 1.8rem; border-radius: 999px;
    background: var(--red); color: #fff; text-decoration: none;
    font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 500;
    transition: background .2s;
  }
  .btn:hover { background: #d0293c; }
  .links { display: flex; justify-content: center; gap: 1rem; margin-top: 2rem; }
  .btn.icon {
    margin-top: 0; width: 4.5rem; height: 4.5rem; padding: 0; border-radius: 1.4rem;
    display: flex; align-items: center; justify-content: center;
  }

  section { max-width: 640px; margin: 0 auto; padding: 4rem 1.5rem; }
  h2 {
    font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 800;
    font-size: 2rem; letter-spacing: -0.02em; margin-bottom: 1rem;
  }
  section p + p { margin-top: 1rem; }

  footer {
    text-align: center; padding: 3rem 1.5rem; color: var(--soft);
    font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: .95rem;
  }

  @media (prefers-reduced-motion: reduce) {
    .hero::before { animation: none; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>

<header>
  <a class="logo" href="#top">godbless</a>
  <nav>
    <a href="#iletisim">İletişim</a>
  </nav>
</header>

<main id="top">
  <div class="hero">
    <h1>godbless</h1>
    <div class="links">
      <a class="btn icon" href="https://www.instagram.com/god1blessed" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
        </svg>
      </a>
      <a class="btn icon" href="https://www.shopier.com/god1bless" target="_blank" rel="noopener" aria-label="Shopier">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 8h14l-1 12H6L5 8z"/>
          <path d="M9 8V6a3 3 0 0 1 6 0v2"/>
        </svg>
      </a>
    </div>
  </div>

  <section id="iletisim">
    <h2>İletişim</h2>
    <p><a href="mailto:god1bless@hotmail.com">god1bless@hotmail.com</a></p>
  </section>
</main>

<footer>© <span id="yil"></span></footer>
<script>document.getElementById("yil").textContent = new Date().getFullYear();</script>
</body>
</html>
