<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2a060b">
<title>godbless</title>
<meta name="description" content="godbless: umut, huzur ve iyi dilekler için küçük bir köşe.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌅</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Newsreader:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #2a060b;
    --dawn: #4d0e17;
    --deep: #1a0306;
    --gold: #ff6b78;
    --red: #b11226;
    --ink: #fbeaea;
    --soft: #e2b4b8;
  }
  * { box-sizing: border-box; margin: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Newsreader", Georgia, serif;
    font-size: 1.2rem;
    line-height: 1.7;
    color: var(--ink);
    background: linear-gradient(180deg, var(--sky) 0%, var(--dawn) 70%, var(--deep) 100%);
    min-height: 100vh;
  }
  a { color: inherit; }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }


  header { display: flex; justify-content: center; padding: 1.5rem 1.5rem 0; }
  header svg { filter: drop-shadow(0 0 8px rgba(255,107,120,.7)); animation: spin 14s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hero {
    position: relative; overflow: hidden; text-align: center;
    padding: 12vh 1.5rem 14vh;
  }
  .hero::before {
    content: ""; position: absolute; left: 50%; bottom: -30%;
    width: 120vmin; height: 120vmin; transform: translateX(-50%);
    background: radial-gradient(circle, rgba(200,40,58,.6) 0%, rgba(120,18,30,.4) 40%, transparent 68%);
    z-index: 0;
    animation: rise 2.4s ease-out both, breathe 6s ease-in-out 2.4s infinite alternate;
  }
  @keyframes rise { from { transform: translate(-50%, 25%); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
  @keyframes breathe { from { transform: translate(-50%, 0) scale(1); opacity: 1; } to { transform: translate(-50%, 0) scale(1.12); opacity: .75; } }
  .hero > * { position: relative; z-index: 1; }
  h1 {
    font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 800;
    font-size: clamp(3.5rem, 17vw, 10rem); line-height: 1; letter-spacing: -0.04em;
  }
  .ch {
    display: inline-block; cursor: default;
    transition: transform .6s cubic-bezier(.34,1.56,.64,1), color .6s, text-shadow .6s;
  }
  .ch:hover {
    transform: translateY(-.14em) rotate(-8deg) scale(1.12);
    color: #ff6b78; text-shadow: 0 0 .25em rgba(255,107,120,.7);
    transition-duration: .18s;
  }
  .ch:nth-child(even):hover { transform: translateY(-.14em) rotate(8deg) scale(1.12); }

  .hero p { max-width: 30ch; margin: 1.5rem auto 2rem; font-style: italic; color: var(--soft); font-size: 1.4rem; }
  .btn {
    display: inline-block; margin-top: 2rem; padding: .8rem 1.8rem; border-radius: 999px;
    background: var(--red); color: #fff; text-decoration: none;
    font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 500;
    transition: background .2s, transform .25s, box-shadow .25s;
  }
  .btn:hover { background: #d0293c; }
  .btn.icon:hover { transform: translateY(-6px) scale(1.06); box-shadow: 0 12px 28px rgba(208,41,60,.45); }
  .btn.icon svg { transition: transform .35s; }
  .btn.icon:hover svg { transform: rotate(-8deg) scale(1.1); }
  @keyframes enter { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }
  h1 { animation: enter 1.1s cubic-bezier(.2,.7,.2,1) .2s both; }
  .links .btn:nth-child(1) { animation: enter .9s cubic-bezier(.2,.7,.2,1) .7s backwards; }
  .links .btn:nth-child(2) { animation: enter .9s cubic-bezier(.2,.7,.2,1) .9s backwards; }
  .links { display: flex; justify-content: center; gap: 1rem; margin-top: 2rem; }
  .btn.icon {
    margin-top: 0; width: 4.5rem; height: 4.5rem; padding: 0; border-radius: 1.4rem;
    display: flex; align-items: center; justify-content: center;
  }

  section { max-width: 640px; margin: 0 auto; padding: 4rem 1.5rem; }
  h2 {
    font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 800;
    font-size: 2rem; letter-spacing: -0.02em; margin-bottom: 1rem;
  }
  section p + p { margin-top: 1rem; }

  .reveal { opacity: 0; transform: translateY(24px); transition: opacity .9s ease, transform .9s ease; }
  .reveal.show { opacity: 1; transform: none; }

  footer {
    text-align: center; padding: 3rem 1.5rem; color: var(--soft);
    font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: .95rem;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .reveal { opacity: 1; transform: none; }
    html { scroll-behavior: auto; }
  }

  /* --- extra depth --- */
  main, header, footer { position: relative; z-index: 1; }
  .particles, .glow, .watermark { position: fixed; pointer-events: none; z-index: 0; }
  .particles { inset: 0; overflow: hidden; }
  .particles i {
    position: absolute; bottom: 0; border-radius: 50%;
    background: radial-gradient(circle, #ffb3ba, rgba(208,41,60,0)); opacity: 0;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0% { transform: translate(0, 10vh); opacity: 0; }
    15% { opacity: .9; }
    100% { transform: translate(var(--dx), -110vh); opacity: 0; }
  }
  .glow {
    width: 420px; height: 420px; left: 0; top: 0; margin: -210px 0 0 -210px;
    background: radial-gradient(circle, rgba(208,41,60,.28), transparent 65%);
    opacity: 0; transition: opacity .6s;
  }
  .watermark {
    right: -15vmin; bottom: -15vmin; width: 60vmin; height: 60vmin; opacity: .07;
    animation: spin 60s linear infinite;
  }
  .rings {
    position: absolute; left: 50%; top: 46%; width: clamp(320px, 78vmin, 760px); aspect-ratio: 1;
    transform: translate(calc(-50% + var(--tx, 0px)), calc(-50% + var(--ty, 0px))); transition: transform .25s linear; z-index: 0; pointer-events: none;
  }
  .hero > .rings { position: absolute; }
  .rings b { position: absolute; inset: 0; border-radius: 50%; }
  .rings b:nth-child(1) { border: 1px dashed rgba(251,234,234,.28); animation: spin 50s linear infinite; }
  .rings b:nth-child(2) { inset: 12%; border: 1px solid rgba(255,107,120,.3); animation: spin 36s linear infinite reverse; }
  .rings b:nth-child(3) { inset: 24%; border: 1px dotted rgba(251,234,234,.22); animation: spin 28s linear infinite; }
  h1 { text-shadow: 0 0 50px rgba(208,41,60,.55); }
  #iletisim {
    text-align: center; width: min(640px, calc(100% - 3rem)); padding: 2.5rem 1.5rem; margin: 2rem auto 5rem;
    background: rgba(255,255,255,.05); border: 1px solid rgba(251,234,234,.16); border-radius: 1.5rem;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  #iletisim a { text-decoration: none; border-bottom: 1px solid rgba(255,107,120,.6); transition: color .2s, text-shadow .2s; }
  #iletisim a:hover { color: #ff6b78; text-shadow: 0 0 14px rgba(255,107,120,.7); }
  #iletisim .links .btn { animation: none; border-bottom: 0; }
  #iletisim .links { margin-top: 1.5rem; gap: .8rem; }
  #iletisim .links .btn.icon { width: 3.4rem; height: 3.4rem; border-radius: 1.05rem; }
  #iletisim .links .btn.icon svg { width: 22px; height: 22px; }
  #iletisim .links .btn:hover { color: #fff; text-shadow: none; }
  footer { border-top: 1px solid rgba(251,234,234,.1); }
  @media (prefers-reduced-motion: reduce) { .particles, .glow { display: none; } }

  /* --- touch / phone extras --- */
  .ch.pop {
    transform: translateY(-.14em) rotate(-8deg) scale(1.12);
    color: #ff6b78; text-shadow: 0 0 .25em rgba(255,107,120,.7); transition-duration: .18s;
  }
  .burst {
    position: fixed; width: 9px; height: 9px; margin: -4px 0 0 -4px; border-radius: 50%;
    background: #ff6b78; pointer-events: none; z-index: 5; animation: burst .7s ease-out forwards;
  }
  @keyframes burst { to { transform: translate(var(--bx), var(--by)) scale(.2); opacity: 0; } }
  header svg { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .btn { -webkit-tap-highlight-color: transparent; }
  @media (hover: none) { .btn.icon:active { transform: scale(.92); } }
</style>
</head>
<body>

<svg class="watermark" viewBox="0 0 48 48" aria-hidden="true">
  <circle cx="24" cy="24" r="22" fill="#fff"/>
  <path d="M24 2A22 22 0 0 1 24 46A11 11 0 0 1 24 24A11 11 0 0 0 24 2Z" fill="#d0293c"/>
  <circle cx="24" cy="13" r="3.5" fill="#d0293c"/><circle cx="24" cy="35" r="3.5" fill="#fff"/>
</svg>
<div class="particles" aria-hidden="true"></div>
<div class="glow" aria-hidden="true"></div>

<header>
  <svg viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Yin yang">
    <circle cx="24" cy="24" r="22" fill="#ffffff"/>
    <path d="M24 2A22 22 0 0 1 24 46A11 11 0 0 1 24 24A11 11 0 0 0 24 2Z" fill="#d0293c"/>
    <circle cx="24" cy="13" r="3.5" fill="#d0293c"/>
    <circle cx="24" cy="35" r="3.5" fill="#ffffff"/>
    <circle cx="24" cy="24" r="22" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  </svg>
</header>

<main id="top">
  <div class="hero">
    <div class="rings" aria-hidden="true"><b></b><b></b><b></b></div>
    <h1 aria-label="godbless"><span class="ch" aria-hidden="true">g</span><span class="ch" aria-hidden="true">o</span><span class="ch" aria-hidden="true">d</span><span class="ch" aria-hidden="true">b</span><span class="ch" aria-hidden="true">l</span><span class="ch" aria-hidden="true">e</span><span class="ch" aria-hidden="true">s</span><span class="ch" aria-hidden="true">s</span></h1>
    <div class="links">
      <a class="btn icon" href="https://www.instagram.com/godbless.wear" target="_blank" rel="noopener" aria-label="Instagram">

  <section id="iletisim" class="reveal">

    <div class="links">
      <a class="btn icon" href="https://wa.me/905515865338" target="_blank" rel="noopener" aria-label="WhatsApp">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
          <g transform="translate(6.2 5.4) scale(.52)"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></g>

<footer>© <span id="yil"></span> GODBLESS SUPPLY CO.</footer>
<script>
document.getElementById("yil").textContent = new Date().getFullYear();
(function () {
  var els = document.querySelectorAll(".reveal");
  if (!("IntersectionObserver" in window)) { els.forEach(function (e) { e.classList.add("show"); }); return; }
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add("show"); io.unobserve(en.target); } });
  }, { threshold: 0.2 });
  els.forEach(function (e) { io.observe(e); });
})();

(function () {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var box = document.querySelector(".particles");
  for (var i = 0; i < 28; i++) {
    var d = document.createElement("i"), z = 3 + Math.random() * 7;
    d.style.cssText = "left:" + Math.random() * 100 + "%;width:" + z + "px;height:" + z + "px;" +
      "--dx:" + (Math.random() * 120 - 60) + "px;animation-duration:" + (12 + Math.random() * 16) + "s;" +
      "animation-delay:-" + Math.random() * 24 + "s";
    box.appendChild(d);
  }
  var g = document.querySelector(".glow");
  window.addEventListener("mousemove", function (e) {
    g.style.opacity = 1;
    g.style.transform = "translate(" + e.clientX + "px," + e.clientY + "px)";
  });
})();

(function () {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  if (!window.matchMedia("(hover: none) and (pointer: coarse)").matches) return;
  var vib = function (n) { try { navigator.vibrate && navigator.vibrate(n); } catch (e) {} };
  var glow = document.querySelector(".glow");

  function pop(el) {
    if (el._busy) return;
    el._busy = true; el.classList.add("pop"); vib(12);
    setTimeout(function () { el.classList.remove("pop"); el._busy = false; }, 450);
  }
  function burst(x, y) {
    for (var i = 0; i < 8; i++) {
      var b = document.createElement("i"), a = Math.PI * 2 * i / 8, r = 36 + Math.random() * 30;
      b.className = "burst"; b.style.left = x + "px"; b.style.top = y + "px";
      b.style.setProperty("--bx", Math.cos(a) * r + "px"); b.style.setProperty("--by", Math.sin(a) * r + "px");
      document.body.appendChild(b);
      setTimeout(function (n) { n.remove(); }, 750, b);
    }
  }
  function follow(t) {
    glow.style.opacity = 1;
    glow.style.transform = "translate(" + t.clientX + "px," + t.clientY + "px)";
    var el = document.elementFromPoint(t.clientX, t.clientY);
    if (el && el.classList.contains("ch")) pop(el);
  }
  window.addEventListener("touchstart", function (e) {
    var t = e.touches[0]; follow(t); burst(t.clientX, t.clientY);
  }, { passive: true });
  window.addEventListener("touchmove", function (e) { follow(e.touches[0]); }, { passive: true });

  var yy = document.querySelector("header svg");
  yy.addEventListener("click", function () {
    vib([20, 40, 20]);
    yy.animate([{ transform: "rotate(0)" }, { transform: "rotate(720deg)" }], { duration: 1100, easing: "ease-out" });
  });

  var rings = document.querySelector(".rings");
  window.addEventListener("deviceorientation", function (e) {
    if (e.gamma == null) return;
    var x = Math.max(-30, Math.min(30, e.gamma)) * 0.8;
    var y = Math.max(-30, Math.min(30, (e.beta || 0) - 40)) * 0.8;
    rings.style.setProperty("--tx", x + "px"); rings.style.setProperty("--ty", y + "px");
  });
})();
</script>
</body>
</html>
